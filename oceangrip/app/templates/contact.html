{% extends "base.html" %}

{% block title %}Contact Us - OceanGrip{% endblock %}

{% block content %}
<div class="container static-page">
    <h1 class="section-title">Contact Us</h1>

    <div class="contact-layout">
        <div class="contact-info-block">
            <h3>Get in Touch</h3>
            <p><strong>Phone:</strong> +91 XXXXX XXXXX</p>
            <p><strong>Email:</strong> support@oceangrip.com</p>
            <p><strong>Address:</strong> Your Business Address, City, State, PIN</p>

            <a href="https://wa.me/91XXXXXXXXXX" class="btn-primary" target="_blank">Chat on WhatsApp</a>

            <div class="map-embed">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3563.5!2d75.85!3d25.18!"
                    width="100%" height="250" style="border:0;" allowfullscreen loading="lazy">
                </iframe>
            </div>
        </div>

        <form class="contact-form">
            <h3>Send us a Message</h3>
            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Message</label>
            <textarea name="message" required></textarea>

            <button type="submit" class="btn-primary">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
